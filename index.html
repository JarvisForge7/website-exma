<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Website</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #00ff00;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
}

.box {
    width: 90%;
    max-width: 500px;
    padding: 25px;
}

h1 {
    color: red;
    font-size: 28px;
}

#scan {
    font-size: 18px;
}

.progress {
    width: 100%;
    height: 18px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    margin: 20px 0;
}

#bar {
    width: 0%;
    height: 100%;
    background: #00ff00;
    transition: width 0.15s;
}

#finalPrank {
    display: none;
    margin-top: 25px;
}

.big-emoji {
    font-size: 120px;
    line-height: 1;
    animation: pop 0.6s ease;
}

#finalPrank h2 {
    color: white;
    font-size: 38px;
    margin: 15px 0 5px;
}

#finalPrank p {
    font-size: 18px;
}

@keyframes pop {
    0% {
        transform: scale(0);
        opacity: 0;
    }

    70% {
        transform: scale(1.2);
        opacity: 1;
    }

    100% {
        transform: scale(1);
    }
}
</style>
</head>

<body>

<div class="box">

    <h1>⚠️ SYSTEM ALERT ⚠️</h1>

    <p>Security scan in progress...</p>

    <p id="scan">Scanning device... 0%</p>

    <div class="progress">
        <div id="bar"></div>
    </div>

    <div id="finalPrank">
        <div class="big-emoji">😂</div>
        <h2>PRANK!</h2>
        <p>Your phone is completely safe 😎</p>
    </div>

</div>

<script>

let p = 0;

const scan = setInterval(() => {

    p += 10;

    document.getElementById("scan").innerHTML =
        "Scanning device... " + p + "%";

    document.getElementById("bar").style.width =
        p + "%";

    if (p >= 100) {

        clearInterval(scan);

        document.getElementById("scan").innerHTML =
            "Scan complete!";

        document.getElementById("finalPrank").style.display =
            "block";
    }

}, 200);

</script>

</body>
</html>
